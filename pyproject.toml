[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "sbesm"
version = "0.1.0"
description = "Simple But Easy Synchronization Manager: conservative one-way file sync and integrity checker"
requires-python = ">=3.11"

[project.scripts]
sbesm = "sbesm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
