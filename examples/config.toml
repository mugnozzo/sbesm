# Sample .sbesm/config.toml -- this is what `sbesm init` generates for you;
# edit known_categories/profiles by hand afterwards if you like, but leave
# [storage] alone (id/filesystem_uuid are how sbesm recognizes this disk).

[storage]
id = "11111111-2222-3333-4444-555555555555"
name = "backup1"
filesystem_uuid = "ABCD-1234"

[categories]
known = ["documents", "photos", "videos", "music", "projects"]

[profiles.work]
categories = ["documents", "projects"]

[profiles.media]
categories = ["photos", "videos", "music"]

[profiles.everything]
categories = ["documents", "photos", "videos", "music", "projects", "other"]

[sync]
preserve_partial = true
delete_by_default = false
# Uncomment to override the auto-detected filesystem mtime tolerance:
# mtime_tolerance_ns = 2000000

[hashing]
algorithm = "sha256"

# Opt-in: names/globs excluded from scanning, indexing, verifying, diffing,
# and syncing -- matched against each individual file/directory name at any
# depth (not the full path), e.g. a nested "project/.venv" is excluded by
# just ".venv". Nothing is excluded by default; uncomment and edit as needed.
[exclude]
patterns = []
# patterns = ["__pycache__", ".venv", "*.pyc", "node_modules", ".git"]
